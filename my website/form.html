<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>

    <center>
        <div style="background-color: aqua; display: inline-block; height: 300; width: 300;">


            <form>
                <fieldset>


                    <legend>
                        <h1>
                            Registration Form
                        </h1>
                    </legend>
                    <label for="name">name <input type="text" placeholder="Enter your name" id="name"> <br> <br>
                    </label>



                    <label for="email">email <input type="email" placeholder="Enter your email" id="email"> <br>
                        <br></label>



                    <label for="password">password <input type="password" required placeholder="Enter your password"
                            id="password"> <br> <br></label>



                    <label for="age">age <input type="number" placeholder="enter your age" id="age"> <br> <br></label>



                    <input type="range"> <br> <br>



                    <label for="date">date <input type="date" id="date"> <br> <br>
                    </label>

                    <input type="color">



                    <label for="file">file <input type="file" id="file"> <br> <br></label>

                    <label for="bsc">BSC<input type="checkbox" name="education" id="bsc"></label>
                    <label for="ma">MA <input type="checkbox" name="education" id="ma"></label> <br>
                    <br>


                    <label for="female">Female <input type="radio" id="female" name="gender"></label>

                    <label for="male">Male <input type="radio" id="male" name="gender"></label> <br> <br>

                    <input type="reset">

                    <input type="submit">

                        <label for="feedback">Feedback <textarea placeholder="write your feedback" id="feedback"></textarea></label>
                    

                </fieldset>





                <form>
        </div>

    </center>



    </form>





</body>

</html>
